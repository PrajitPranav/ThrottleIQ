name: throttle_iq
description: "ThrottleIQ - Smart Automotive Telemetry Dashboard"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  syncfusion_flutter_gauges: ^33.2.6
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/one.png"
  adaptive_icon_background: "#000000"

flutter:
  uses-material-design: true

  assets:
    - assets/one.png
    - assets/two.png